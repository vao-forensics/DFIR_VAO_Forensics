log_format tusmap '$time_iso8601 $remote_addr $request_method $uri';

server {
  listen 8080;
  server_name _;

  client_max_body_size 20g;

  # Audio-translate results (large UA MP3s) — download links sent by the bot.
  # Files are written by case-maintainer into /srv/dfir/var/audio_results
  # (mounted here read-only). Hard-to-guess uuid-prefixed names; no autoindex.
  # Case outputs (reports, uploaded material) for the person working the case.
  # No autoindex: a link has to be given, it cannot be discovered by browsing.
  location /view/translate_output/ {
    alias /usr/share/nginx/translate_output/;
    autoindex off;
    sendfile on;
    add_header Content-Disposition "attachment";
    add_header Cache-Control "no-store";
  }

  location /view/ {
    alias /usr/share/nginx/cases/;
    autoindex off;
    sendfile on;
    add_header Cache-Control "no-store";
  }

  # The collector executable, so an operator can fetch it over the VPN like everything else.
  # the manifest beside the binary, so the download page can show what it serves
  location = /collector.json {
    alias /usr/share/nginx/dist/collector.json;
    add_header Cache-Control "no-store";
  }

  # a page instead of a bare binary: the link in the bot never needs editing
  location = /collector {
    alias /usr/share/nginx/html/collector.html;
    default_type text/html;
  }

  location = /collector.exe {
    alias /usr/share/nginx/dist/collector.exe;
    include /etc/nginx/conf.d/collector_disp.inc;
  }

  # --- Browser chat (Open WebUI) on the one port VPN clients can reach ---------
  # The app lives at /chat/; everything it asks for by absolute path is proxied below.
  # /chat/ is legacy: WebUI now lives at root. Bounce old links/bookmarks there.
  location = /chat { return 302 /; }
  location /chat/ { return 302 /; }

  location ~ ^/(_app|static|cache|assets|ws|socket\.io|api|ollama|openai|manifest\.json|favicon|health|auth|c/|admin/|workspace|playground|watch|s/|sw\.js|opensearch\.xml|robots\.txt|user\.png|static/) {
    proxy_pass http://open-webui:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_buffering off;
  }

  location /audio/ {
    alias /usr/share/nginx/audio/;
    autoindex off;
    sendfile on;
    tcp_nopush on;
    add_header Content-Disposition "attachment";
    add_header Cache-Control "no-store";
  }

  # Open WebUI owns the site root now (built for base "/"). Upload page moved to /upload/.
  # 18.10: MCP for agent CLI (dfir-mcp, bearer token required, read-only case tools)
  location = /mcp { proxy_pass http://dfir-mcp:8000/mcp; proxy_http_version 1.1;
    proxy_set_header Host $host; proxy_set_header Authorization $http_authorization;
    proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; proxy_send_timeout 3600s;
    client_max_body_size 4m; }
  location /mcp/ { proxy_pass http://dfir-mcp:8000/mcp/; proxy_http_version 1.1;
    proxy_set_header Host $host; proxy_set_header Authorization $http_authorization;
    proxy_buffering off; proxy_cache off; proxy_read_timeout 3600s; proxy_send_timeout 3600s;
    client_max_body_size 4m; }

  location / {
    proxy_pass http://open-webui:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
  }

  # The DFIR upload page (drag-drop) lives here; bot links use DFIR_UPLOAD_BASE=.../upload.
  location = /upload { return 302 /upload/$is_args$args; }
  location /upload/ {
    alias /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ /usr/share/nginx/html/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # Proxy tus uploads through same origin to avoid CORS/network issues
  location /case-name/ {
    proxy_pass http://case-maintainer:8787/case-name/;
    proxy_set_header Host $host;
  }

  location /upload-progress {
    proxy_pass http://case-maintainer:8787/upload-progress;
    proxy_set_header Host $host;
  }

  location /admin-chats {
    proxy_pass http://case-maintainer:8787/admin-chats;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  location /files/ {
    access_log /var/log/nginx/tus_map.log tusmap;
    proxy_pass http://tusd:1080/files/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # tus headers
    proxy_set_header Tus-Resumable $http_tus_resumable;
    proxy_set_header Upload-Length $http_upload_length;
    proxy_set_header Upload-Offset $http_upload_offset;
    proxy_set_header Upload-Metadata $http_upload_metadata;
    proxy_set_header Content-Type $http_content_type;

    add_header Tus-Resumable "1.0.0" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET,POST,PATCH,HEAD,OPTIONS,DELETE" always;
    add_header Access-Control-Allow-Headers "Tus-Resumable,Upload-Length,Upload-Offset,Upload-Metadata,Content-Type,Authorization" always;

    if ($request_method = OPTIONS) {
      return 204;
    }
  }
}
