# Вихід пісочниць в інтернет ЛИШЕ через цей проксі і ЛИШЕ на дозволені домени (білий список).
# Прямий вихід контейнерів 172.30.0.0/16 заблоковано у DOCKER-USER (infra/sandbox/firewall.sh).
User tinyproxy
Group tinyproxy
Port 3128
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
Syslog On
LogLevel Info
MaxClients 50
# клієнти — тільки пісочниці
Allow 172.30.0.0/16
DisableViaHeader Yes
# білий список доменів (ERE, за іменем хоста); усе інше, зокрема IP-адреси, — відмова
Filter "/etc/tinyproxy/allow.txt"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes
ConnectPort 443
ConnectPort 80
