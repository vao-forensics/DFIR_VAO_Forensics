# Collector core build on a GitHub Windows runner.
#
# What it builds: the C# collector program (src/collector_src/v4/*.cs) compiled with the .NET
# Framework csc, exactly as build_v4.py does locally. What it does NOT add: the tool payload
# (KAPE, EZ Tools, Hayabusa, THOR ...). Those are licensed third-party tools and never go into
# the repository; build_v4.py appends them on your own machine from collector_kit/.
#
# Seal key: the PUBLIC half of your archive key (not a secret) comes from two repository
# variables, COLLECTOR_SEAL_KEYID and COLLECTOR_SEAL_MODULUS (Settings > Secrets and variables >
# Actions > Variables). Without them the build uses a throwaway key and is marked TEST: archives
# collected by such a build cannot be opened by your bot.
name: collector

on:
  push:
    paths:
      - 'src/collector_src/v4/**'
      - '.github/workflows/collector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seal key (public half)
        shell: pwsh
        env:
          KEYID: ${{ vars.COLLECTOR_SEAL_KEYID }}
          MODULUS: ${{ vars.COLLECTOR_SEAL_MODULUS }}
        run: |
          $kind = 'release'
          if (-not $env:MODULUS) {
            $rsa = [System.Security.Cryptography.RSA]::Create(4096)
            $env:MODULUS = [Convert]::ToBase64String($rsa.ExportParameters($false).Modulus)
            $env:KEYID = 'TEST-' + (Get-Date -Format 'yyyyMMddHHmm')
            $kind = 'test'
            Write-Output '::warning::COLLECTOR_SEAL_MODULUS is not set: TEST key, your bot cannot open archives from this build'
          }
          $cs = @"
          // GENERATED by .github/workflows/collector.yml - public half of the archive key.
          static class SealKey
          {
              public const string KeyId = "$($env:KEYID)";
              public const string ModulusB64 = "$($env:MODULUS)";
              public const string ExponentB64 = "AQAB";
          }
          "@
          Set-Content -Path src/collector_src/v4/Seal_key.cs -Value $cs -Encoding utf8
          "BUILD_KIND=$kind" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $src = Get-ChildItem src/collector_src/v4 -Filter *.cs | ForEach-Object FullName
          New-Item -ItemType Directory -Force out | Out-Null
          & $csc /nologo /target:exe /platform:anycpu /optimize+ `
            /win32manifest:src/collector_src/launcher.manifest /win32icon:src/collector_src/collector.ico `
            /reference:System.Management.dll /reference:System.IO.Compression.dll `
            /reference:System.IO.Compression.FileSystem.dll `
            "/out:out/DFIR_Collector_core_$($env:BUILD_KIND).exe" @src
          if ($LASTEXITCODE -ne 0) { throw "csc failed ($LASTEXITCODE)" }
          Get-FileHash out/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: collector-core-${{ env.BUILD_KIND }}
          path: out/
          retention-days: 30
